# Storage for the nightly market-data snapshot (scripts/build_snapshot.py writes
# it, the Co-Pilot reads it). Any S3-compatible endpoint works — AWS S3,
# Cloudflare R2, MinIO, Backblaze B2. Leave this table out and the app simply
# fetches live instead.
#
# For Cloudflare R2, endpoint_url is
# https://<account-id>.r2.cloudflarestorage.com and region is "auto".
[snapshot]
bucket=""
prefix="snapshots"
endpoint_url=""
region=""
access_key=""
secret_key=""

