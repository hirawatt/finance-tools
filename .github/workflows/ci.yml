name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.2

      - name: Install dependencies
        run: uv sync --frozen

      # requirements.txt is generated for Streamlit Community Cloud and cannot
      # be regenerated there, so a dependency bump that forgets it (e.g. a
      # Dependabot PR touching pyproject.toml/uv.lock only) drifts the deploy.
      - name: Check requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-emit-project --no-hashes --output-file requirements.txt
          git --no-pager diff --exit-code -- requirements.txt

      - name: Run tests
        run: uv run --frozen pytest -q
