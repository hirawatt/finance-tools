<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-label="The Trading Dashboard by Hirawat">
  <defs>
    <linearGradient id="cardMark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="1" stop-color="#1D4ED8"/>
    </linearGradient>
    <radialGradient id="cardGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#1F6FEB" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#1F6FEB" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cardGrid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 L0 0 L0 60" fill="none" stroke="#E2E8F0" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="#FFFFFF"/>
  <rect width="1200" height="630" fill="url(#cardGrid)"/>
  <circle cx="166" cy="331" r="330" fill="url(#cardGlow)"/>

  <rect x="96" y="261" width="140" height="140" rx="31" fill="url(#cardMark)"/>
  <path d="M122 360 L151 329 L171 349 L208 305" fill="none" stroke="#FFFFFF"
        stroke-width="15" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="208" cy="305" r="11" fill="#FFFFFF"/>

  <text x="286" y="281" fill="#0B1220" font-size="60" font-weight="700" letter-spacing="-1"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    The Trading Dashboard
  </text>
  <line x1="288" y1="310" x2="392" y2="310" stroke="#1F6FEB" stroke-width="3" stroke-linecap="round"/>

  <text x="287" y="350" fill="#64748B" font-size="15" font-weight="600" letter-spacing="4.4"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    BY HIRAWAT
  </text>
  <text x="286" y="390" fill="#64748B" font-size="20"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    Capital-markets analytics for Indian portfolios,
  </text>
  <text x="286" y="420" fill="#64748B" font-size="20"
        font-family="Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
    watchlists and trade ideas
  </text>
</svg>
